[project]
name = "growthlens"
version = "0.1.0"
description = "GrowthLens - AI-Driven Evidence Extraction & RAG Pipeline for Continuous Talent Intelligence"
requires-python = ">=3.11"
dependencies = [
    # API Framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Configuration
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    # Database
    "supabase>=2.10.0",
    # HTTP Client
    "httpx>=0.27.0",
    # LLM & RAG
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-chroma>=0.2.0",
    # Vector Store
    "chromadb>=0.5.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring live services (deselect with '-m \"not integration\"')",
    "security: marks security-specific tests",
]
