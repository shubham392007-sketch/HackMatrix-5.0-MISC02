<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .footer-bg { fill: #161616; rx: 14px; stroke: #2E2E2E; stroke-width: 1.5; }
      .brand-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; fill: #DFE968; }
      .brand-sub { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 500; fill: #E5E7EB; }
      .brand-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #9CA3AF; }
      
      .pulse-line {
        stroke: #DFE968;
        stroke-width: 2;
        stroke-dasharray: 8 16;
        fill: none;
        animation: footerDash 4s linear infinite;
      }
      @keyframes footerDash {
        to { stroke-dashoffset: -48; }
      }
    </style>
  </defs>

  <!-- Surface -->
  <rect class="footer-bg" x="2" y="2" width="916" height="116" />

  <!-- Animated Bottom Accent Line -->
  <path class="pulse-line" d="M 30 100 L 890 100" />

  <!-- Brand Identity -->
  <text class="brand-title" x="35" y="44">GrowthLens</text>
  <text class="brand-sub" x="35" y="68">Continuous Talent Intelligence &amp; Skill Growth Engine · HackMatrix 5.0 (Track MISC02)</text>
  <text class="brand-mono" x="35" y="86">Real evidence. Deeper insights. Continuous growth.</text>

  <!-- Verified Quick Links -->
  <g transform="translate(680, 25)">
    <rect fill="#242818" stroke="#DFE968" stroke-width="1" rx="6" width="200" height="65" />
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#DFE968" x="14" y="26">⚡ ZERO CLOUD LEAKAGE</text>
    <text font-family="'Space Grotesk', sans-serif" font-size="10" fill="#A3A3A3" x="14" y="44">100% On-Premise Local AI</text>
    <text font-family="'JetBrains Mono', monospace" font-size="10" fill="#E5E7EB" x="14" y="58">PyTorch + Ollama Qwen</text>
  </g>
</svg>
