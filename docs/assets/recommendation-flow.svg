<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .box-bg { fill: #1A1A1A; rx: 12px; stroke: #2E2E2E; stroke-width: 1.5; }
      .box-highlight { fill: #242818; rx: 12px; stroke: #DFE968; stroke-width: 2; }
      .text-title { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .text-body { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 500; fill: #A3A3A3; }
      .tag-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #1C1C1C; }
      
      /* Animated Connection Paths */
      .action-wire {
        stroke: #DFE968;
        stroke-width: 2.5;
        stroke-dasharray: 6 12;
        fill: none;
        animation: wirePulse 2.5s linear infinite;
      }
      .action-wire-alt {
        stroke: #38BDF8;
        stroke-width: 2.5;
        stroke-dasharray: 6 12;
        fill: none;
        animation: wirePulse 2.5s linear infinite 0.4s;
      }
      @keyframes wirePulse {
        to { stroke-dashoffset: -36; }
      }

      .pulse-beacon {
        animation: beaconGlow 2s infinite ease-in-out;
      }
      @keyframes beaconGlow {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect fill="#141414" stroke="#262626" stroke-width="1.5" rx="16" x="2" y="2" width="916" height="316" />

  <!-- Title -->
  <text class="text-title" x="28" y="32" font-size="14" fill="#DFE968">FEATURE 3: NEXT-ACTION RECOMMENDATION &amp; MENTORSHIP ENGINE</text>
  <text font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A" x="630" y="32">⚡ Multimodal Closed-Loop System</text>

  <!-- Animated Pathway Wires -->
  <!-- Alert to Selector -->
  <path d="M 210 160 L 290 160" stroke="#3F3F46" stroke-width="2" />
  <path class="action-wire" d="M 210 160 L 290 160" />

  <!-- Selector to Branch 1 (YouTube Deep-Link) -->
  <path d="M 460 140 C 510 140, 520 85, 570 85" stroke="#3F3F46" stroke-width="2" fill="none" />
  <path class="action-wire" d="M 460 140 C 510 140, 520 85, 570 85" />

  <!-- Selector to Branch 2 (Peer Mentorship) -->
  <path d="M 460 180 C 510 180, 520 235, 570 235" stroke="#3F3F46" stroke-width="2" fill="none" />
  <path class="action-wire-alt" d="M 460 180 C 510 180, 520 235, 570 235" />

  <!-- Branches to Feedback -->
  <path d="M 750 85 C 790 85, 800 130, 830 150" stroke="#3F3F46" stroke-width="2" fill="none" />
  <path d="M 750 235 C 790 235, 800 190, 830 170" stroke="#3F3F46" stroke-width="2" fill="none" />
  <path class="action-wire" d="M 750 85 C 790 85, 800 130, 830 150" />
  <path class="action-wire-alt" d="M 750 235 C 790 235, 800 190, 830 170" />

  <!-- STEP 1: DETECTED TRAJECTORY GAP -->
  <g transform="translate(30, 110)">
    <rect class="box-bg" width="180" height="100" />
    <circle cx="20" cy="22" r="6" fill="#EF4444" />
    <text class="text-title" x="35" y="26">Decay / Gap Alert</text>
    <text class="text-body" x="16" y="50">Competency: Kubernetes</text>
    <text class="text-body" x="16" y="66">Trend: Declining (Score 34)</text>
    <text font-family="'JetBrains Mono', monospace" font-size="10" fill="#EF4444" x="16" y="86">Hazard Half-Life: 42d</text>
  </g>

  <!-- STEP 2: MULTI-ARMED ACTION SELECTOR -->
  <g transform="translate(290, 105)">
    <rect class="box-highlight" width="170" height="110" />
    <rect fill="#DFE968" rx="4" x="14" y="14" width="70" height="16" />
    <text class="tag-text" x="19" y="26">AI ENGINE</text>
    <text class="text-title" x="14" y="52">Action Selector</text>
    <text class="text-body" x="14" y="72">• Urgency Ranking</text>
    <text class="text-body" x="14" y="86">• Resource Matching</text>
    <text class="text-body" x="14" y="100">• Mentorship Pairing</text>
  </g>

  <!-- STEP 3A: YOUTUBE DEEP-LINKING -->
  <g transform="translate(570, 40)">
    <rect class="box-bg" width="180" height="90" />
    <rect fill="#FF0000" rx="4" x="14" y="12" width="60" height="16" />
    <text font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF" x="18" y="24">YOUTUBE</text>
    <text class="text-title" x="14" y="46">Transcript Deep-Link</text>
    <text class="text-body" x="14" y="62">Targeted Pod Security Tutorial</text>
    <text font-family="'JetBrains Mono', monospace" font-size="10" fill="#DFE968" x="14" y="78">▶ Deep Link &amp;t=142s</text>
  </g>

  <!-- STEP 3B: ACID PEER MENTORSHIP -->
  <g transform="translate(570, 190)">
    <rect class="box-bg" width="180" height="90" />
    <rect fill="#38BDF8" rx="4" x="14" y="12" width="65" height="16" />
    <text class="tag-text" x="19" y="24">SQLITE ACID</text>
    <text class="text-title" x="14" y="46">Peer Mentorship</text>
    <text class="text-body" x="14" y="62">Matched with: Siddhesh B.</text>
    <text font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" x="14" y="78">94% Domain Overlap</text>
  </g>

  <!-- STEP 4: VERIFIED FEEDBACK LOOP -->
  <g transform="translate(810, 110)">
    <circle cx="35" cy="50" r="30" fill="#242818" stroke="#DFE968" stroke-width="2" />
    <text class="text-title" x="14" y="48" font-size="11">Feedback</text>
    <text class="text-body" x="18" y="62" font-size="9">Loop</text>
  </g>
</svg>
